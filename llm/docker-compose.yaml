services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - "/home/docker-data/ollama:/root/.ollama"
    environment:
      OLLAMA_CONTEXT_LENGTH: 128000
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "11434:11434"

  hermes:
    container_name: hermes
    image: nousresearch/hermes-agent
    restart: unless-stopped
    volumes:
      - "/home/docker-data/hermes:/opt/data"
    environment:
      API_SERVER_ENABLED: true
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_SERVER_KEY}
      API_SERVER_CORS_ORIGINS: "*"
      GATEWAY_ALLOW_ALL_USERS: true
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET}
    command: gateway run
    ports:
      - "8642:8642"
      - "9119:9119"

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:latest
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - "/home/docker-data/open-webui:/app/backend/data"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    depends_on:
      - ollama
      - hermes
      - searxng

  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - "/home/docker-data/searxng:/etc/searxng"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

networks:
  default:
    name: llm_network
