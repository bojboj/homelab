services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "/home/docker-data/portainer:/data"
    ports:
      - "9443:9443"

  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: docker.io/jc21/nginx-proxy-manager:latest
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - "/home/docker-data/nginx-proxy-manager:/data"
      - "/home/docker-data/letsencrypt:/etc/letsencrypt"

networks:
  default:
    name: homelab_network